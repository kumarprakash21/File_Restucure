<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <rect width="1440" height="920" fill="#fbfaf8"/>
  <rect x="0" y="0" width="1440" height="78" fill="#fbfaf8" stroke="#e9e5e1"/>
  <text x="82" y="48" font-family="Arial" font-size="22" font-weight="700" fill="#202020">✦ FileForge</text>
  <text x="650" y="47" font-family="Arial" font-size="14" fill="#666">Tools</text><text x="710" y="47" font-family="Arial" font-size="14" fill="#666">How it works</text>
  <rect x="1180" y="27" width="180" height="30" rx="15" fill="#fff" stroke="#ddd8d2"/><circle cx="1200" cy="42" r="4" fill="#66b18a"/><text x="1212" y="47" font-family="Arial" font-size="12" fill="#6c6966">Files stay on your device</text>
  <text x="165" y="151" font-family="Arial" font-size="12" font-weight="700" letter-spacing="3" fill="#7658ee">QUICK FILE UTILITIES</text>
  <text x="165" y="220" font-family="Arial" font-size="67" font-weight="700" fill="#202020">Make files <tspan fill="#7658ee">work</tspan></text>
  <text x="165" y="292" font-family="Arial" font-size="67" font-weight="700" fill="#202020">harder.</text>
  <text x="165" y="337" font-family="Arial" font-size="18" fill="#6f6b69">Convert, resize, and compress your files in seconds.</text>
  <rect x="165" y="370" width="154" height="48" rx="8" fill="#202020"/><text x="185" y="400" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Explore tools  ↓</text>
  <ellipse cx="1105" cy="250" rx="190" ry="94" fill="none" stroke="#d8d0fa" transform="rotate(-20 1105 250)"/><rect x="1040" y="140" width="150" height="190" rx="14" fill="#d9ccff" transform="rotate(15 1115 235)"/><text x="1063" y="180" font-family="Arial" font-size="14" font-weight="700" fill="#7658ee">PDF</text><rect x="960" y="170" width="150" height="190" rx="14" fill="#7660e9" transform="rotate(-14 1035 265)"/><text x="985" y="210" font-family="Arial" font-size="14" font-weight="700" fill="#fff">JPG</text>
  <line x1="0" y1="480" x2="1440" y2="480" stroke="#e9e5e1"/>
  <text x="165" y="542" font-family="Arial" font-size="12" font-weight="700" letter-spacing="3" fill="#7658ee">YOUR TOOLKIT</text><text x="165" y="583" font-family="Arial" font-size="34" font-weight="700" fill="#202020">Pick a tool, get it done.</text>
  <g font-family="Arial"><rect x="165" y="615" width="205" height="145" rx="10" fill="#fff" stroke="#b6a5ff"/><rect x="182" y="633" width="40" height="40" rx="10" fill="#e8e1ff"/><text x="195" y="660" font-size="24" fill="#7658ee">▧</text><text x="182" y="705" font-size="15" font-weight="700" fill="#202020">PDF to image</text><text x="182" y="728" font-size="12" fill="#8b8784">Turn PDF pages into JPGs</text><text x="340" y="744" font-size="20" fill="#aaa">→</text>
  <rect x="385" y="615" width="205" height="145" rx="10" fill="#fff" stroke="#e9e5e1"/><rect x="402" y="633" width="40" height="40" rx="10" fill="#ffe9d6"/><text x="413" y="660" font-size="24" fill="#bb7029">↔</text><text x="402" y="705" font-size="15" font-weight="700" fill="#202020">Resize image</text><text x="402" y="728" font-size="12" fill="#8b8784">Change dimensions &amp; quality</text>
  <rect x="605" y="615" width="205" height="145" rx="10" fill="#fff" stroke="#e9e5e1"/><rect x="622" y="633" width="40" height="40" rx="10" fill="#c6dcec"/><text x="635" y="660" font-size="24" fill="#4680a6">⌁</text><text x="622" y="705" font-size="15" font-weight="700" fill="#202020">Compress PDF</text><text x="622" y="728" font-size="12" fill="#8b8784">Make your PDF lighter</text>
  <rect x="825" y="615" width="205" height="145" rx="10" fill="#fff" stroke="#e9e5e1"/><rect x="842" y="633" width="40" height="40" rx="10" fill="#f1c8dd"/><text x="854" y="660" font-size="24" fill="#a45d83">▤</text><text x="842" y="705" font-size="15" font-weight="700" fill="#202020">Image to PDF</text><text x="842" y="728" font-size="12" fill="#8b8784">Bundle images into one PDF</text>
  <rect x="1045" y="615" width="205" height="145" rx="10" fill="#fff" stroke="#e9e5e1"/><rect x="1062" y="633" width="40" height="40" rx="10" fill="#bdddcf"/><text x="1074" y="660" font-size="24" fill="#43886b">◌</text><text x="1062" y="705" font-size="15" font-weight="700" fill="#202020">Compress image</text><text x="1062" y="728" font-size="12" fill="#8b8784">Reduce image file size</text></g>
</svg>
